<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐼 Panda Gateway — Test Client</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: #e8e8e8;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: #111;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #888;
  }
  .badge.ok { border-color: #22c55e44; color: #22c55e; background: #22c55e11; }
  .badge.err { border-color: #ef444444; color: #ef4444; background: #ef444411; }

  #config {
    background: #111;
    border-bottom: 1px solid #222;
    padding: 10px 20px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  #config label { font-size: 11px; color: #666; }
  #config input {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: #e8e8e8;
    padding: 5px 10px;
    font-size: 12px;
    font-family: monospace;
    outline: none;
    transition: border-color .15s;
  }
  #config input:focus { border-color: #444; }
  #config input#inp-url { width: 340px; }
  #config input#inp-token { width: 220px; }
  #config select {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: #e8e8e8;
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #1d4ed8;
    border-bottom-right-radius: 3px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-bottom-left-radius: 3px;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    border: 1px solid #222;
    color: #555;
    font-size: 12px;
    padding: 6px 14px;
  }
  .msg.error {
    align-self: center;
    background: #ef444411;
    border: 1px solid #ef444433;
    color: #ef4444;
    font-size: 12px;
  }
  .thinking { opacity: .5; font-style: italic; }

  #footer {
    padding: 14px 20px;
    background: #111;
    border-top: 1px solid #222;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  #inp-msg {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #e8e8e8;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 120px;
    transition: border-color .15s;
    line-height: 1.5;
  }
  #inp-msg:focus { border-color: #444; }
  #btn-send {
    background: #1d4ed8;
    border: none;
    border-radius: 10px;
    color: #fff;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
    align-self: flex-end;
    height: 42px;
  }
  #btn-send:hover { background: #2563eb; }
  #btn-send:disabled { background: #222; color: #555; cursor: default; }
  #btn-clear {
    background: transparent;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #666;
    padding: 10px 12px;
    font-size: 12px;
    cursor: pointer;
    height: 42px;
    transition: border-color .15s, color .15s;
  }
  #btn-clear:hover { border-color: #444; color: #aaa; }

  #status { font-size: 11px; }
</style>
</head>
<body>

<header>
  <span style="font-size:22px">🐼</span>
  <h1>Panda Gateway</h1>
  <span class="badge" id="status">—</span>
</header>

<div id="config">
  <label>API URL</label>
  <input id="inp-url" type="text" value="https://9fc4de04-e48c-46f9-a216-8b0e11d13942-8000-7ks64aj1byp6.picard.replit.dev" />
  <label>Token</label>
  <input id="inp-token" type="text" value="6dcbf607612135373f7270370e54325a7f1430a55395066c" />
  <label>Modèle</label>
  <select id="inp-model">
    <option>gpt-4o</option>
    <option>gpt-4o-mini</option>
    <option>gpt-4-turbo</option>
    <option>gpt-3.5-turbo</option>
  </select>
  <button onclick="pingGateway()" style="background:#1a1a1a;border:1px solid #2a2a2a;color:#888;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;">Ping</button>
</div>

<div id="messages">
  <div class="msg system">Prêt. Envoie un message pour tester le gateway.</div>
</div>

<div id="footer">
  <textarea id="inp-msg" placeholder="Message…" rows="1"></textarea>
  <button id="btn-clear" onclick="clearChat()">🗑</button>
  <button id="btn-send" onclick="sendMessage()">Envoyer</button>
</div>

<script>
  const messages = [];

  const $ = id => document.getElementById(id);
  const messagesEl = $('messages');

  function getConfig() {
    return {
      url: $('inp-url').value.replace(/\/$/, ''),
      token: $('inp-token').value.trim(),
      model: $('inp-model').value,
    };
  }

  function addMsg(role, content, cls = '') {
    const div = document.createElement('div');
    div.className = `msg ${role} ${cls}`;
    div.textContent = content;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function setStatus(text, type = '') {
    const el = $('status');
    el.textContent = text;
    el.className = 'badge ' + type;
  }

  async function pingGateway() {
    setStatus('ping…', '');
    const { url, token } = getConfig();
    try {
      const r = await fetch(`${url}/v1/models`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (r.ok) {
        const d = await r.json();
        setStatus('✓ connecté', 'ok');
        addMsg('system', `✓ Gateway OK — ${JSON.stringify(d).slice(0,80)}…`);
      } else {
        const t = await r.text();
        setStatus(`✗ ${r.status}`, 'err');
        addMsg('error', `Erreur ${r.status}: ${t}`);
      }
    } catch(e) {
      setStatus('✗ hors ligne', 'err');
      addMsg('error', `Connexion impossible: ${e.message}`);
    }
  }

  async function sendMessage() {
    const ta = $('inp-msg');
    const text = ta.value.trim();
    if (!text) return;

    const { url, token, model } = getConfig();
    ta.value = '';
    ta.style.height = '';
    $('btn-send').disabled = true;

    messages.push({ role: 'user', content: text });
    addMsg('user', text);

    const thinking = addMsg('assistant', '…', 'thinking');

    try {
      setStatus('envoi…', '');
      const r = await fetch(`${url}/v1/chat/completions`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ model, messages, stream: false }),
      });

      if (!r.ok) {
        const t = await r.text();
        thinking.remove();
        addMsg('error', `Erreur ${r.status}: ${t}`);
        setStatus(`✗ ${r.status}`, 'err');
        messages.pop();
        return;
      }

      const data = await r.json();
      const reply = data.choices?.[0]?.message?.content ?? JSON.stringify(data);
      messages.push({ role: 'assistant', content: reply });
      thinking.textContent = reply;
      thinking.className = 'msg assistant';
      setStatus('✓ ok', 'ok');

    } catch(e) {
      thinking.remove();
      addMsg('error', `Erreur réseau: ${e.message}`);
      setStatus('✗ erreur', 'err');
      messages.pop();
    } finally {
      $('btn-send').disabled = false;
      ta.focus();
    }
  }

  function clearChat() {
    messages.length = 0;
    messagesEl.innerHTML = '<div class="msg system">Conversation effacée.</div>';
  }

  // Auto-resize textarea
  $('inp-msg').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // Enter = send, Shift+Enter = newline
  $('inp-msg').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Ping on load
  pingGateway();
</script>
</body>
</html>
